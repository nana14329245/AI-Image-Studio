name: CI

# verify runs on every push, not just main: a feature branch between pull requests
# would otherwise sit entirely unverified, which is exactly what happened after
# PR #6 merged and three more commits landed on the branch with no CI at all.
on:
  push:
  pull_request:

# A push to a branch that also has an open pull request triggers both events;
# superseding runs on the same ref are cancelled rather than queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
        env:
          # Build-time placeholders only. The app reads real values at runtime,
          # and refuses to start with these (see getSupabaseConfig).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

  # Browser tests of what a signed-out visitor can reach, against a production
  # build. The Supabase URL points at a closed local port: these pages must work
  # without a session, and nothing here should need a real backend. The PostHog
  # key is a dummy aimed at an unreachable host, so the consent banner is tested
  # without sending anything anywhere. Signed-in tests need a test account and run
  # locally only (see README).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e_placeholder
      NEXT_PUBLIC_POSTHOG_KEY: phc_e2e_placeholder
      NEXT_PUBLIC_POSTHOG_HOST: http://127.0.0.1:9
      E2E_EXPECT_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npx playwright test --project=public --project=public-mobile

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Scans only the commits a pull request adds. It deliberately skips the older
  # history, which still contains keys that were rotated after the fact and would
  # fail every run until that history is rewritten.
  #
  # Runs the gitleaks binary rather than gitleaks-action, which failed here
  # without producing a readable reason on a repo whose logs need auth to fetch.
  secret-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan commits added by this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks git \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --config=.gitleaks.toml \
            --redact \
            --no-banner
